plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'SI2026Lab2Main'
}

group = 'mk.finki.si'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}
